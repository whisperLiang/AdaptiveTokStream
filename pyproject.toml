[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivetokstream"
version = "0.1.0"
description = "Pre-encoded AdapTok VOD with progressive discrete token transport"
requires-python = ">=3.10"
dependencies = ["numpy<2", "PyYAML", "av>=12"]

[project.optional-dependencies]
codec = ["torch==2.5.1", "torchvision==0.20.1", "einops", "easydict", "timm", "transformers<5", "huggingface-hub<1", "safetensors", "pandas", "tensorboard", "decord", "lpips", "scipy", "pulp", "requests", "DISTS-pytorch"]
dev = ["pytest", "pytest-cov", "ruff", "radon", "mutmut"]

[project.scripts]
adaptivetokstream = "adaptivetokstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires official AdapTok weights and CUDA", "socket: starts independent sender/receiver processes"]

[tool.ruff]
line-length = 100

[tool.mutmut]
source_paths = ["src/adaptivetokstream/protocol.py"]
pytest_add_cli_args_test_selection = ["tests/test_protocol.py"]
pytest_add_cli_args = ["-q"]

[tool.coverage.run]
patch = ["subprocess"]
